name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.ts"
      - "package.json"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js (for npm authentication & provenance)
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Check version and publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "none")

          echo "Package name:      $PACKAGE_NAME"
          echo "Local version:     $CURRENT_VERSION"
          echo "Published version: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Notice: Version $CURRENT_VERSION is already published on npm. Skipping publish."
          else
            echo "Publishing $PACKAGE_NAME@$CURRENT_VERSION to npm with provenance..."
            npm publish --access public --provenance
            echo "Successfully published $PACKAGE_NAME@$CURRENT_VERSION to npm!"
          fi
