name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "src/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install root dependencies & build imagepressor
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install demo dependencies & build demo
        env:
          GITHUB_PAGES: "true"
        run: |
          cd demo
          bun install --frozen-lockfile
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./demo/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
